# Grunddaten
title: "ChronoLabDD"
subtitle: "The Translational Chronopsychiatry Lab"
description: "Research on sleep, circadian rhythms and affective disorders at TU Dresden."
locale: "en-US"
url: "https://chronolabdresden.github.io"

# Theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

include:
  - _pages

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

# Links in der Fußzeile
footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/EURE-ADRESSE"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/EURE-ADRESSE"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
      comments: false
