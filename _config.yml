# Grunddaten
title: "Chrono Lab Dresden"
description: "Kurzbeschreibung des Labors in einem Satz."
locale: "de-DE"
url: "https://chronolabdd.github.io"

# Theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# Ordner mit den Unterseiten einbeziehen
include:
  - _pages

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

# Standardeinstellungen für alle Seiten
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
